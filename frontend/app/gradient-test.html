<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Text Test</title>
  <style>
    .gradient-text {
      font-size: 3rem;
      font-weight: bold;
      background: linear-gradient(90deg, #fff, #60a5fa, #1e40af);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      margin: 2rem;
      font-family: sans-serif;
    }
    body {
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
  </style>
</head>
<body>
  <span class="gradient-text">Unlocking Mysteries</span>
</body>
</html>
